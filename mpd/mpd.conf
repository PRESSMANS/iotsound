music_directory     "/music"
db_file             "/var/lib/mpd/database"
log_file            "/var/log/mpd/mpd.log"
pid_file            "/run/mpd/mpd.pid"
state_file          "/var/lib/mpd/state"
sticker_database    "/var/lib/mpd/sticker.sql"

user                "root"
bind_to_address     "0.0.0.0"
port                "6600"

# ファイル変更を自動検知してDB更新
auto_update         "yes"
auto_update_depth   "0"

# m4a/FLAC/MP3対応
decoder {
    plugin          "ffmpeg"
    enabled         "yes"
}

audio_output {
    type            "pulse"
    name            "balena-sound"
    server          "localhost"
    sink            "balena-sound.input"
}

input {
    plugin          "curl"
}
